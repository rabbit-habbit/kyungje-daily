name: Daily Brief

on:
  schedule:
    # 매일 평일 (월-금) KST 08:50 시작 · 다중 cron으로 신뢰성 보강.
    # 손경제 팟캐스트는 08:30 KST 발행 · CDN 반영 여유 20분 확보 위해 08:50로 설정.
    # (이전 08:37은 RSS 반영 전이라 전날 에피소드를 재픽하는 사고 발생)
    # GitHub Actions schedule은 best-effort라 skip되는 경우가 있어 3번 시도.
    # run.py가 같은 날 archive 존재 시 자동 skip (idempotent) → 비용은 한 번분만.
    # ※ UTC 기준. KST = UTC+9. KST 월-금 아침이면 UTC는 일-목 전날 밤.
    - cron: '50 23 * * 0-4'  # KST 08:50 (1차, 주요 트리거)
    - cron: '20 0 * * 1-5'   # KST 09:20 (백업1)
    - cron: '50 0 * * 1-5'   # KST 09:50 (백업2)
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 archive 이미 있어도 재생성하고 카톡/publ 재전송'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_notify:
        description: '카톡·publ 그룹톡 발송 스킵 (아카이브만 덮어쓰기). publ 아티클도 스킵.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      youtube_url:
        description: '(선택) MBC 손경제 유튜브 영상 URL - RSS 지연 시 유튜브에서 fetch'
        required: false
        default: ''
        type: string

permissions:
  # run.py가 docs/를 commit + push · gh workflow run이 actions:write 필요
  contents: write
  actions: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      did_regenerate: ${{ steps.pipeline.outputs.did_regenerate }}
    env:
      TZ: Asia/Seoul
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-sonnet-4-6
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      # 카카오가 refresh_token을 교체했을 때 Secret을 자기 손으로 갱신하는 데
      # 쓴다. GITHUB_TOKEN으로는 Secret을 못 쓴다. 없으면 교체 때 annotation만
      # 띄우고 넘어간다 (그 경우 사람이 재발급해야 한다).
      SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
      LINK_SIGN_KEY: ${{ secrets.LINK_SIGN_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline (RSS → indicators → Claude → render → push)
        id: pipeline
        # 기본은 idempotent. dispatch에서도 force input이 'true'일 때만 --force.
        # skip된 경우 did_regenerate=false → 후속 publ workflow가 다시 발송하지 않도록 게이팅.
        env:
          FORCE_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' && '--force' || '' }}
          NOTIFY_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_notify == 'true' && '--no-notify' || '' }}
          YOUTUBE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.youtube_url || '' }}
        run: |
          # archive 존재 여부를 사전에 기록해서 skip 여부 판단
          DATE=$(date +%F)
          ARCHIVE="docs/archive/${DATE}.html"
          EXISTED=false
          [ -f "$ARCHIVE" ] && EXISTED=true

          python pipeline/run.py --push $FORCE_FLAG $NOTIFY_FLAG

          # 재생성 여부 판정.
          # ★ 실행 후 archive가 실제로 있는지도 본다. 연휴처럼 정규 방송이 없어
          #   발행을 건너뛴 날은 archive가 안 생기는데, 예전 로직은 EXISTED=false만
          #   보고 did_regenerate=true로 판단해 후속 카톡/publ을 발송할 뻔했다.
          AFTER=false
          [ -f "$ARCHIVE" ] && AFTER=true

          if [ "$AFTER" = "false" ]; then
            echo "did_regenerate=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  보고서가 생성되지 않음 (정규 방송 없음 등) · 후속 발송 안 함"
          elif [ "$EXISTED" = "false" ] || [ "$FORCE_FLAG" = "--force" ]; then
            echo "did_regenerate=true" >> "$GITHUB_OUTPUT"
          else
            echo "did_regenerate=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  오늘 archive 이미 존재 · skip 완료 (후속 카톡/publ 발송 안 함)"
          fi

      - name: Trigger publ workflows (only when regenerated)
        # 재생성한 경우에만 후속 파이프라인 실행 → skip 시 카톡/publ 재발송 방지
        # skip_notify=true도 스킵 (dispatch에서 알림만 뺀 아카이브 덮어쓰기용)
        if: steps.pipeline.outputs.did_regenerate == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_notify == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publ-post.yml --repo ${{ github.repository }}
          echo "✓ publ-post 트리거 (publ-article은 publ-post 완료 시 자동 체이닝)"

      - name: 카톡 알림 실패 시 job 실패 처리
        # ★ 반드시 publ 트리거 **뒤에** 둔다. 카톡이 안 가도 브리핑·그룹톡은
        #   정상 발송돼야 하므로, 여기서 실패시켜도 구독자 발송은 이미 끝난
        #   상태다. job을 실패시키는 건 GitHub가 실패 알림 메일을 보내주는
        #   유일한 수단이다. 조용한 실패를 이틀 모르고 지나간 뒤에 넣었다.
        if: steps.pipeline.outputs.kakao_failed == 'true'
        run: |
          echo "카카오톡 '나에게 보내기' 알림이 실패했습니다."
          echo "브리핑 생성·그룹톡·아티클은 정상 발송됐습니다. 위 annotation의 사유를 확인하세요."
          echo "KOE322(expired_or_invalid_refresh_token)이면 KAKAO_REFRESH_TOKEN 재발급이 필요합니다."
          exit 1

      - name: Upload intermediate JSONs as artifact (on failure)
        # 파이프라인 자체가 깨진 경우만. 카톡 실패로 job이 빨개진 경우는 제외.
        if: failure() && steps.pipeline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-${{ github.run_id }}
          path: |
            out/
          retention-days: 7
