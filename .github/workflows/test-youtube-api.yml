name: Test YouTube API

# YOUTUBE_API_KEY secret이 등록됐고 fetch_from_youtube_channel_api()가
# 실제로 오늘 채널에서 [손경제] 영상을 잘 찾아오는지 확인하는 일회성 테스트.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Test YouTube API fetch
        run: |
          python -c "
          from pipeline import fetch_rss
          import json
          from dataclasses import asdict
          ep = fetch_rss.fetch_from_youtube_channel_api()
          d = asdict(ep)
          # description 앞부분만 프리뷰
          d['description'] = d['description'][:500] + '...(truncated)'
          d['description_html'] = '(omitted)'
          print(json.dumps(d, ensure_ascii=False, indent=2))
          "
