name: Publ Group Post

# daily.yml이 성공적으로 완료되면 자동 실행 → publ 그룹 채팅방에 오늘 브리핑 링크 게시.
# 수동 트리거도 지원 (Actions 탭에서 Run workflow).

on:
  # daily.yml이 실제로 재생성한 경우에만 gh workflow run으로 트리거함 (중복 방지).
  # 수동 실행도 지원.
  workflow_dispatch:
    inputs:
      force:
        description: '보류(.grouptalk-hold)를 무시하고 그룹톡 발송'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publ-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    env:
      TZ: Asia/Seoul
      PUBL_EMAIL: ${{ secrets.PUBL_EMAIL }}
      PUBL_PASSWORD: ${{ secrets.PUBL_PASSWORD }}
      LINK_SIGN_KEY: ${{ secrets.LINK_SIGN_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (Playwright 포함)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Restore publ session (있으면 로그인 skip)
        env:
          SESSION_B64: ${{ secrets.PUBL_SESSION_B64 }}
        run: |
          if [ -n "$SESSION_B64" ]; then
            echo "$SESSION_B64" | base64 -d > .publ_session.json
            echo "✓ 세션 파일 복원 ($(wc -c < .publ_session.json) bytes)"
          else
            echo "세션 secret 없음 · 로그인으로 fallback"
          fi

      - name: 그룹톡 보류 여부 확인
        id: hold
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "force=true - 보류를 무시하고 발송합니다"
          elif [ -f .grouptalk-hold ] && grep -qx 'next' .grouptalk-hold; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice::.grouptalk-hold 때문에 그룹톡을 보내지 않았습니다. 확인 후 force=true로 다시 실행하세요."
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post today's brief to publ group chat
        # publ 관리자 콘솔 세션이 24시간 미만이라 매일 fresh 로그인이 더 안정적
        if: steps.hold.outputs.held != 'true'
        run: python pipeline/notify_publ.py --today --no-session

      - name: Trigger publ-article workflow
        # 보류 중에도 아티클은 나간다. 그룹톡만 멈추는 게 목적이고,
        # force 재실행 때 또 만들면 같은 날 아티클이 두 개가 된다.
        if: inputs.force != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publ-article.yml --repo ${{ github.repository }}
          echo "✓ publ-article 트리거"

      - name: Upload debug artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publ-debug-${{ github.run_id }}
          path: |
            .publ_session.json
          retention-days: 3
          if-no-files-found: ignore
